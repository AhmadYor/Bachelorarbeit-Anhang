volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  open-webui:
  recoll_index:
 

networks:
  demo:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
    - N8N_RESTRICT_FILE_ACCESS_TO=/data/shared
    - NODES_EXCLUDE=[]
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama
  environment:
    # Modell nicht nach 5 Min. Inaktivitaet entladen (Standard), sondern dauerhaft
    # im Speicher halten, damit keine ~50s Cold-Start-Ladezeit mehr anfaellt.
    - OLLAMA_KEEP_ALIVE=24h

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - 5432:5432
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    # Run as root to access shared files created by Docling (also running as root)
    user: root
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
      - ./shared/rag-files:/data/rag-files
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================
  # Recoll - Keyword-Index (Xapian) + Such-API
  # ===========================================
  # Findet Kandidaten-Dateien per Volltext-Suche; n8n liest die Top-N live.
  # Such-API:  GET http://recoll:8089/search?q=...&n=8&prefixes=Ordner/
  # Indexierung: recollindex inkrementell per Cron (SMB kann kein inotify)
  recoll:
    build: ./recoll
    container_name: recoll
    hostname: recoll
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 8089:8089
    environment:
      - RECOLL_CONFDIR=/root/.recoll
      - SHARE_ROOT=/data/share
    volumes:
      # Share-Root: MAR_KUNDENBETREUUNG, relpath beginnt mit dem Kundenordner (z.B. Leoni/)
      - ./shared/MAR_KUNDENBETREUUNG:/data/share:ro
      - recoll_index:/root/.recoll
      # Produktion: echten Fileserver per CIFS einhaengen -> Bind-Mount oben
      # durch das 'fileshare'-Volume ersetzen:
      #   - fileshare:/data/share:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Static File Server - Serves shared folder
  # ===========================================
  # Access files at http://localhost:8080/
  # Example: http://localhost:8080/extracted-images/image_xxx.png
  static-files:
    image: nginx:alpine
    hostname: static-files
    container_name: static-files
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./shared/extracted-images:/usr/share/nginx/html:ro
      - ./shared/onenote:/srv/onenote:ro
    command: |
      sh -c "echo 'server {
        listen 80;
        root /usr/share/nginx/html;
        index chat.html;
        autoindex on;
        location /onenote/ {
          alias /srv/onenote/;
          add_header Access-Control-Allow-Origin *;
        }
        location / {
          try_files \$$uri \$$uri/ =404;
          add_header Access-Control-Allow-Origin *;
        }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 3000:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

      # ===== LDAP / Active Directory Login =====
      - ENABLE_LDAP=true
      - LDAP_SERVER_LABEL=MARHRO
      - LDAP_SERVER_HOST=${LDAP_SERVER_HOST}
      - LDAP_SERVER_PORT=${LDAP_SERVER_PORT:-389}
      - LDAP_USE_TLS=${LDAP_USE_TLS:-false}
      - LDAP_VALIDATE_CERT=${LDAP_VALIDATE_CERT:-true}
      - LDAP_APP_DN=${LDAP_APP_DN}
      - LDAP_APP_PASSWORD=${LDAP_APP_PASSWORD}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:-OU=MARHRO,DC=MARHRO,DC=LOCAL}
      - LDAP_ATTRIBUTE_FOR_USERNAME=sAMAccountName
      #- LDAP_ATTRIBUTE_FOR_USERNAME=anr
      - LDAP_ATTRIBUTE_FOR_MAIL=mail
      - LDAP_SEARCH_FILTERS=${LDAP_SEARCH_FILTERS:-}

      # ===== LDAP-Gruppen-Synchronisation =====
      - ENABLE_LDAP_GROUP_MANAGEMENT=true
      - ENABLE_LDAP_GROUP_CREATION=false
      - LDAP_ATTRIBUTE_FOR_GROUPS=memberOf

      # ===== Auto-Onboarding für neue LDAP-User =====
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user

  # ===========================================
  # QuickChart - Chart Rendering Service
  # ===========================================
  # Rendert Chart.js-Konfigurationen als PNG-Bilder.
  # Erreichbar unter http://localhost:3400/chart
  # Pipe-Funktion: QUICKCHART_BASE_URL Valve auf
  #   http://<server-ip-oder-hostname>:3400/chart setzen
  quickchart:
    image: ianw/quickchart
    container_name: quickchart
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 3400:3400

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd