# Wurzelverzeichnis des indexierten Shares (im Container gemountet)
topdirs = /data/share

# Sprache(n) fürs Stemming
indexstemminglanguages = german english

# Dateien/Ordner überspringen
skippedNames = ~* #* .* *.tmp *.bak Thumbs.db ~$* desktop.ini

# OCR für gescannte/Bild-PDFs (für born-digital PDFs nicht nötig).
pdfocr = 1
ocrprogs = tesseract
tesseractlang = deu+eng

# Keine Symlinks nach außen verfolgen
followLinks = 0
